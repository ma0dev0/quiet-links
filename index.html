<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Links</title>
  <meta name="description" content="A minimal personal link dashboard">
  <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="12" fill="%23101214"/%3E%3Ccircle cx="32" cy="32" r="10" fill="%235dd3b8"/%3E%3C/svg%3E'>
  <link rel="preconnect" href="https://www.google.com">
  <link rel="preconnect" href="https://unpkg.com">
  <script src="https://unpkg.com/lucide@1.21.0/dist/umd/lucide.min.js" defer></script>
  <style>
    :root {
      --bg: #101214;
      --panel: #181c20;
      --panel-2: #20262b;
      --text: #eef2f5;
      --muted: #aab4be;
      --line: #303841;
      --accent: #5dd3b8;
      --accent-2: #f3bd5b;
      --danger: #ef6f6c;
      --shadow: none;
      color-scheme: dark;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans JP", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a:focus-visible,
    button:focus-visible,
    .field input:focus-visible,
    .field select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent), transparent 38%);
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 0 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .clock {
      min-width: 128px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: right;
    }

    .clock strong {
      display: block;
      font-size: 1rem;
      line-height: 1.1;
    }

    .clock span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .icon-button,
    .text-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .icon-button {
      width: 40px;
      padding: 0;
    }

    .text-button {
      padding: 0 12px;
    }

    .icon-button:hover,
    .text-button:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent), var(--line) 45%);
      background: var(--panel-2);
    }

    .icon-button svg,
    .text-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .search-panel {
      display: grid;
      align-content: center;
      min-height: 104px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(720px, 100%);
      min-height: 52px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg), var(--panel) 32%);
    }

    .search-box svg {
      width: 20px;
      height: 20px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .search-box:focus-within {
      border-color: var(--accent);
      outline: 3px solid color-mix(in srgb, var(--accent), transparent 72%);
      outline-offset: 3px;
    }

    .status-panel {
      display: grid;
      align-content: space-between;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .metric {
      display: grid;
      gap: 3px;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .metric strong {
      font-size: 2.15rem;
      line-height: 1;
      letter-spacing: 0;
    }

    .quick-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.86rem;
    }

    .quick-link img {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 8px 0 18px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      white-space: nowrap;
    }

    .tab[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent), var(--line) 35%);
      background: color-mix(in srgb, var(--accent), var(--panel) 86%);
      color: var(--text);
    }

    .tab-count {
      display: inline-grid;
      min-width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 999px;
      background: color-mix(in srgb, var(--bg), transparent 18%);
      color: var(--muted);
      font-size: 0.75rem;
    }

    .section {
      margin: 6px 0 28px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-actions {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .section-title {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .section-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 70px;
      gap: 12px;
      min-height: 116px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: none;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent), var(--line) 45%);
      background: var(--panel-2);
    }

    .service-icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg), var(--panel) 54%);
      overflow: hidden;
    }

    .service-icon img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }

    .card-body {
      min-width: 0;
    }

    .card h3 {
      margin: 1px 0 5px;
      overflow: hidden;
      font-size: 1rem;
      line-height: 1.2;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card p {
      display: -webkit-box;
      min-height: 2.4em;
      margin: 0 0 11px;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.35;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      max-width: 100%;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.1;
    }

    mark {
      padding: 0 2px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--accent), transparent 72%);
      color: var(--text);
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(2, 32px);
      align-content: start;
      gap: 6px;
    }

    .mini-button {
      display: inline-grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg), var(--panel) 46%);
      color: var(--muted);
    }

    .mini-button:hover,
    .mini-button[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent), var(--line) 35%);
      color: var(--text);
    }

    .mini-button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .mini-button[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent-2), var(--panel) 82%);
    }

    .mini-button.danger:hover {
      border-color: color-mix(in srgb, var(--danger), var(--line) 30%);
      color: var(--danger);
    }

    .mini-button svg {
      width: 16px;
      height: 16px;
    }

    .empty {
      display: none;
      padding: 26px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel), transparent 30%);
      color: var(--muted);
      text-align: center;
    }

    .empty.is-visible {
      display: block;
    }

    dialog {
      width: min(560px, calc(100% - 26px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dialog-head h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .field input,
    .field select {
      min-height: 42px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg), var(--panel) 34%);
      color: var(--text);
      padding: 0 11px;
      outline: 0;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }

    .field input:user-invalid {
      border-color: var(--danger);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .primary {
      border-color: color-mix(in srgb, var(--accent), var(--line) 30%);
      background: var(--accent);
      color: #07110f;
      font-weight: 700;
    }

    .secondary {
      background: transparent;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(420px, calc(100% - 32px));
      padding: 10px 10px 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
    }

    .toast[hidden] {
      display: none;
    }

    .toast span {
      min-width: 0;
      flex: 1;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .icon-button:hover,
      .text-button:hover,
      .card:hover {
        transform: none;
      }
    }

    @media (max-width: 850px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: start;
      }

      .clock {
        text-align: left;
      }

      .hero {
        display: grid;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 14px;
      }

      .search-panel {
        min-height: 92px;
        padding: 14px;
      }

      .status-panel {
        padding: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 108px;
      }

      .toast {
        right: 10px;
        bottom: 10px;
        width: calc(100% - 20px);
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="toolbar">
        <div class="clock" aria-live="polite">
          <strong id="clockTime">--:--</strong>
          <span id="clockDate">----/--/--</span>
        </div>
        <button class="icon-button" id="importButton" type="button" title="インポート" aria-label="インポート">
          <i data-lucide="upload"></i>
        </button>
        <button class="icon-button" id="exportButton" type="button" title="エクスポート" aria-label="エクスポート">
          <i data-lucide="download"></i>
        </button>
        <button class="text-button" id="addButton" type="button">
          <i data-lucide="plus"></i>
          追加
        </button>
        <input class="visually-hidden" id="importFile" type="file" accept="application/json,.json">
      </div>
    </header>

    <section class="hero" aria-label="検索">
      <div class="search-panel">
        <label class="search-box">
          <i data-lucide="search"></i>
          <span class="visually-hidden">検索キーワード</span>
          <input id="searchInput" autocomplete="off" type="search" placeholder="サービス名・カテゴリ・タグで検索">
        </label>
      </div>

      <aside class="status-panel" aria-label="固定リンク">
        <div class="metric">
          <span>表示中</span>
          <strong id="visibleCount">0</strong>
        </div>
        <div class="metric">
          <span>お気に入り</span>
          <strong id="favoriteCount">0</strong>
        </div>
        <div class="quick-row" id="quickRow"></div>
      </aside>
    </section>

    <nav class="tabs" id="tabs" aria-label="カテゴリ"></nav>
    <div id="sections"></div>
    <p class="empty" id="emptyState">一致するリンクがありません。</p>
  </main>

  <dialog id="linkDialog">
    <form method="dialog" id="linkForm">
      <div class="dialog-head">
        <h2 id="linkDialogTitle">リンクを追加</h2>
        <button class="icon-button" type="button" id="closeDialogButton" title="閉じる" aria-label="閉じる">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="form-grid">
        <label class="field">
          <span>名前</span>
          <input id="nameField" required autocomplete="off" placeholder="例: 社内Wiki">
        </label>
        <label class="field">
          <span>URL</span>
          <input id="urlField" required inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://example.com">
        </label>
        <label class="field">
          <span>説明</span>
          <input id="descriptionField" placeholder="例: 手順書や議事録">
        </label>
        <label class="field">
          <span>カテゴリ</span>
          <input id="categoryField" list="categoryOptions" autocomplete="off" placeholder="例: 仕事">
          <datalist id="categoryOptions"></datalist>
        </label>
        <label class="field">
          <span>タグ</span>
          <input id="tagsField" placeholder="例: work, docs">
        </label>
      </div>
      <div class="dialog-actions">
        <button class="text-button secondary" type="button" id="cancelDialogButton">キャンセル</button>
        <button class="text-button primary" type="submit">
          <i data-lucide="save"></i>
          <span id="submitLabel">保存</span>
        </button>
      </div>
    </form>
  </dialog>

  <template id="cardTemplate">
    <article class="card">
      <a class="service-icon" target="_blank" rel="noopener noreferrer"></a>
      <div class="card-body">
        <a class="card-link" target="_blank" rel="noopener noreferrer">
          <h3></h3>
          <p></p>
        </a>
        <div class="tag-row"></div>
      </div>
      <div class="card-actions">
        <button class="mini-button favorite-button" type="button" title="お気に入り" aria-label="お気に入り">
          <i data-lucide="star"></i>
        </button>
        <button class="mini-button move-up-button" type="button" title="上へ移動" aria-label="上へ移動">
          <i data-lucide="chevron-up"></i>
        </button>
        <button class="mini-button edit-button" type="button" title="編集" aria-label="編集">
          <i data-lucide="pencil"></i>
        </button>
        <button class="mini-button move-down-button" type="button" title="下へ移動" aria-label="下へ移動">
          <i data-lucide="chevron-down"></i>
        </button>
        <a class="mini-button open-button" target="_blank" rel="noopener noreferrer" title="開く" aria-label="開く">
          <i data-lucide="external-link"></i>
        </a>
        <button class="mini-button danger delete-button" type="button" title="削除" aria-label="削除">
          <i data-lucide="trash-2"></i>
        </button>
      </div>
    </article>
  </template>

  <div class="toast" id="undoToast" role="status" aria-live="polite" hidden>
    <span id="undoMessage">リンクを削除しました。</span>
    <button class="text-button secondary" id="undoButton" type="button">元に戻す</button>
  </div>

        description: "買い物、注文履歴、配送確認",
        category: "買い物",
        tags: ["shopping"]
      },
      {
        id: "rakuten",
        name: "楽天市場",
        url: "https://www.rakuten.co.jp/",
        description: "買い物、ポイント、セール確認",
        category: "買い物",
        tags: ["shopping", "points"]
      }
    ];

    const storageKey = "quiet-links-services-v1";
    const sectionsEl = document.querySelector("#sections");
    const tabsEl = document.querySelector("#tabs");
    const quickRowEl = document.querySelector("#quickRow");
    const searchInput = document.querySelector("#searchInput");
    const visibleCountEl = document.querySelector("#visibleCount");
    const favoriteCountEl = document.querySelector("#favoriteCount");
    const emptyStateEl = document.querySelector("#emptyState");
    const cardTemplate = document.querySelector("#cardTemplate");
    const dialog = document.querySelector("#linkDialog");
    const form = document.querySelector("#linkForm");
    const dialogTitle = document.querySelector("#linkDialogTitle");
    const categoryField = document.querySelector("#categoryField");
    const categoryOptionsEl = document.querySelector("#categoryOptions");
    const nameField = document.querySelector("#nameField");
    const urlField = document.querySelector("#urlField");
    const descriptionField = document.querySelector("#descriptionField");
    const tagsField = document.querySelector("#tagsField");
    const submitLabel = document.querySelector("#submitLabel");
    const addButton = document.querySelector("#addButton");
    const importButton = document.querySelector("#importButton");
    const exportButton = document.querySelector("#exportButton");
    const importFile = document.querySelector("#importFile");
    const closeDialogButton = document.querySelector("#closeDialogButton");
    const cancelDialogButton = document.querySelector("#cancelDialogButton");
    const undoToast = document.querySelector("#undoToast");
    const undoMessage = document.querySelector("#undoMessage");
    const undoButton = document.querySelector("#undoButton");

    let services = loadServices();
    let activeCategory = "すべて";
    let editingServiceId = null;
    let pendingDelete = null;
    let undoTimer = null;

    render();
    updateClock();
    setInterval(updateClock, 1000 * 30);

    searchInput.addEventListener("input", render);
    addButton.addEventListener("click", () => openDialog());
    exportButton.addEventListener("click", exportServices);
    importButton.addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", importServices);
    undoButton.addEventListener("click", restoreDeletedService);
    closeDialogButton.addEventListener("click", () => dialog.close());
    cancelDialogButton.addEventListener("click", () => dialog.close());
    document.addEventListener("keydown", handleGlobalKeydown);
    urlField.addEventListener("input", () => urlField.setCustomValidity(""));
    urlField.addEventListener("blur", () => {
      const url = normalizeUrl(urlField.value);
      if (url) urlField.value = url;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const url = normalizeUrl(urlField.value);
      if (!url) {
        urlField.setCustomValidity("http:// または https:// で開けるURLを入力してください。");
        urlField.reportValidity();
        return;
      }

      const currentService = editingServiceId
        ? services.find((item) => item.id === editingServiceId)
        : null;
      const category = cleanText(categoryField.value, 40) || "未分類";
      const service = {
        id: editingServiceId || createServiceId(),
        name: nameField.value.trim(),
        url,
        description: descriptionField.value.trim(),
        category,
        tags: splitTags(tagsField.value),
        custom: currentService ? currentService.custom === true : true,
        favorite: currentService ? currentService.favorite === true : false
      };

      services = editingServiceId
        ? sanitizeServices(services.map((item) => item.id === editingServiceId ? service : item))
        : sanitizeServices([service, ...services]);
      saveServices();
      form.reset();
      dialog.close();
      editingServiceId = null;
      activeCategory = service.category;
      render();
    });

    function loadServices() {
      try {
        const stored = JSON.parse(readStorage(storageKey));
        if (Array.isArray(stored)) return sanitizeServices(stored);
      } catch {
        // 壊れた保存データは無視して初期リンクを表示します。
      }
      return sanitizeServices(defaultServices);
    }

    function saveServices() {
      services = sanitizeServices(services);
      writeStorage(storageKey, JSON.stringify(services));
    }

    function readStorage(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        // 保存できない環境でも画面操作は続けられるようにします。
      }
    }

    function sanitizeServices(items) {
      const usedIds = new Set();
      return items
        .map((item, index) => sanitizeService(item, index))
        .filter(Boolean)
        .map((service) => {
          const baseId = service.id;
          let id = baseId;
          let suffix = 2;
          while (usedIds.has(id)) {
            id = `${baseId}-${suffix}`;
            suffix += 1;
          }
          usedIds.add(id);
          return { ...service, id };
        });
    }

    function sanitizeService(item, index) {
      if (!item || typeof item !== "object") return null;

      const url = normalizeUrl(item.url);
      if (!url) return null;

      const hostname = getHostname(url);
      const service = {
        id: cleanText(item.id, 80) || `service-${index}`,
        name: cleanText(item.name, 80) || hostname || "名称未設定",
        url,
        description: cleanText(item.description, 160),
        category: cleanText(item.category, 40) || "未分類",
        tags: Array.isArray(item.tags)
          ? item.tags.map((tag) => cleanText(tag, 32)).filter(Boolean).slice(0, 8)
          : [],
        favorite: item.favorite === true
      };

      if (item.custom === true) service.custom = true;
      return service;
    }

    function cleanText(value, maxLength) {
      if (value == null) return "";
      return String(value).replace(/\s+/g, " ").trim().slice(0, maxLength);
    }

    function createServiceId() {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
        return `custom-${globalThis.crypto.randomUUID()}`;
      }
      return `custom-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function getSearchTokens(query) {
      return [...new Set(query.toLowerCase().split(/\s+/).map((token) => token.trim()).filter(Boolean))].slice(0, 8);
    }

    function scoreService(service, tokens) {
      if (tokens.length === 0) return 0;

      const fields = {
        name: service.name.toLowerCase(),
        description: service.description.toLowerCase(),
        category: service.category.toLowerCase(),
        hostname: getHostname(service.url).toLowerCase(),
        tags: (service.tags || []).map((tag) => tag.toLowerCase())
      };

      let total = 0;
      for (const token of tokens) {
        const tokenScore = scoreToken(fields, token);
        if (tokenScore === 0) return 0;
        total += tokenScore;
      }
      return total;
    }

    function scoreToken(fields, token) {
      let score = 0;
      if (fields.name === token) score += 140;
      else if (fields.name.startsWith(token)) score += 110;
      else if (fields.name.includes(token)) score += 90;

      if (fields.tags.some((tag) => tag === token)) score += 80;
      else if (fields.tags.some((tag) => tag.includes(token))) score += 55;

      if (fields.category.includes(token)) score += 50;
      if (fields.hostname.includes(token)) score += 35;
      if (fields.description.includes(token)) score += 25;
      return score;
    }

    function setHighlightedText(element, text, tokens) {
      element.replaceChildren();
      if (tokens.length === 0 || !text) {
        element.textContent = text;
        return;
      }

      const source = String(text);
      const lowerSource = source.toLowerCase();
      let index = 0;

      while (index < source.length) {
        const match = findNextTokenMatch(lowerSource, tokens, index);
        if (!match) {
          element.append(document.createTextNode(source.slice(index)));
          break;
        }

        if (match.start > index) {
          element.append(document.createTextNode(source.slice(index, match.start)));
        }

        const mark = document.createElement("mark");
        mark.textContent = source.slice(match.start, match.end);
        element.append(mark);
        index = match.end;
      }
    }

    function findNextTokenMatch(text, tokens, fromIndex) {
      return tokens
        .map((token) => {
          const start = text.indexOf(token, fromIndex);
          return start === -1 ? null : { start, end: start + token.length };
        })
        .filter(Boolean)
        .sort((a, b) => a.start - b.start || b.end - b.start - (a.end - a.start))[0];
    }

    function render() {
      const query = searchInput.value.trim();
      const searchTokens = getSearchTokens(query);
      const categories = getCategories();
      if (!categories.includes(activeCategory)) activeCategory = "すべて";

      renderTabs(categories);
      renderQuickLinks();
      renderCategoryOptions(categories);

      const filtered = services
        .map((service, index) => ({
          index,
          score: scoreService(service, searchTokens),
          service
        }))
        .filter(({ service, score }) => {
          const categoryMatch = activeCategory === "すべて" || service.category === activeCategory;
          return categoryMatch && (searchTokens.length === 0 || score > 0);
        })
        .sort((a, b) => searchTokens.length > 0 ? b.score - a.score || a.index - b.index : a.index - b.index)
        .map(({ service }) => service);

      const grouped = groupByCategory(filtered);
      sectionsEl.replaceChildren();

      grouped.forEach(([category, items]) => {
        const section = document.createElement("section");
        section.className = "section";

        const sectionHead = document.createElement("div");
        sectionHead.className = "section-head";
        const titleGroup = document.createElement("div");
        const sectionTitle = document.createElement("h2");
        sectionTitle.className = "section-title";
        sectionTitle.textContent = category;
        const sectionSubtitle = document.createElement("p");
        sectionSubtitle.className = "section-subtitle";
        sectionSubtitle.textContent = `${items.length}件`;
        titleGroup.append(sectionTitle, sectionSubtitle);
        sectionHead.append(titleGroup, createCategoryActions(category));

        const grid = document.createElement("div");
        grid.className = "grid";
        items.forEach((service) => grid.append(createCard(service, searchTokens)));
        section.append(sectionHead, grid);
        sectionsEl.append(section);
      });

      visibleCountEl.textContent = String(filtered.length);
      favoriteCountEl.textContent = String(services.filter((service) => service.favorite).length);
      emptyStateEl.classList.toggle("is-visible", filtered.length === 0);
      refreshIcons();
    }

    function createCard(service, searchTokens = []) {
      const node = cardTemplate.content.firstElementChild.cloneNode(true);
      const hostname = getHostname(service.url);
      const iconLink = node.querySelector(".service-icon");
      const cardLink = node.querySelector(".card-link");
      const openButton = node.querySelector(".open-button");
      const favoriteButton = node.querySelector(".favorite-button");
      const editButton = node.querySelector(".edit-button");
      const deleteButton = node.querySelector(".delete-button");

      iconLink.href = service.url;
      iconLink.setAttribute("aria-label", `${service.name}を開く`);
      iconLink.replaceChildren(createFaviconImage(hostname, 64));
      cardLink.href = service.url;
      cardLink.setAttribute("aria-label", `${service.name}を開く`);
      openButton.href = service.url;
      openButton.setAttribute("aria-label", `${service.name}を開く`);
      setHighlightedText(node.querySelector("h3"), service.name, searchTokens);
      setHighlightedText(node.querySelector("p"), service.description || hostname, searchTokens);
      favoriteButton.setAttribute("aria-pressed", service.favorite ? "true" : "false");
      favoriteButton.setAttribute(
        "aria-label",
        service.favorite ? `${service.name}のお気に入りを解除` : `${service.name}をお気に入りに追加`
      );
      editButton.setAttribute("aria-label", `${service.name}を編集`);
      deleteButton.hidden = !service.custom;
      deleteButton.setAttribute("aria-label", `${service.name}を削除`);

      const tagRow = node.querySelector(".tag-row");
      [hostname, ...(service.tags || [])].slice(0, 4).forEach((tag) => {
        const tagEl = document.createElement("span");
        tagEl.className = "tag";
        setHighlightedText(tagEl, tag, searchTokens);
        tagRow.append(tagEl);
      });

      const position = getCategoryPosition(service);
      favoriteButton.addEventListener("click", () => {
        services = services.map((item) => item.id === service.id ? { ...item, favorite: !item.favorite } : item);
        saveServices();
        render();
      });

      editButton.addEventListener("click", () => openDialog(service));

      const moveUpButton = node.querySelector(".move-up-button");
      const moveDownButton = node.querySelector(".move-down-button");
      moveUpButton.disabled = position.index <= 0;
      moveDownButton.disabled = position.index === -1 || position.index >= position.total - 1;
      moveUpButton.setAttribute("aria-label", `${service.name}を上へ移動`);
      moveDownButton.setAttribute("aria-label", `${service.name}を下へ移動`);
      moveUpButton.addEventListener("click", () => moveService(service.id, -1));
      moveDownButton.addEventListener("click", () => moveService(service.id, 1));

      deleteButton.addEventListener("click", () => {
        deleteService(service);
      });

      return node;
    }

    function createCategoryActions(category) {
      const actions = document.createElement("div");
      actions.className = "section-actions";
      const categories = getCategories().filter((item) => item !== "すべて");
      const index = categories.indexOf(category);

      const moveUpButton = createMiniIconButton("chevron-up", `${category}を上へ移動`);
      const moveDownButton = createMiniIconButton("chevron-down", `${category}を下へ移動`);
      const renameButton = createMiniIconButton("pencil", `${category}の名前を変更`);

      moveUpButton.disabled = index <= 0;
      moveDownButton.disabled = index === -1 || index >= categories.length - 1;
      moveUpButton.addEventListener("click", () => moveCategory(category, -1));
      moveDownButton.addEventListener("click", () => moveCategory(category, 1));
      renameButton.addEventListener("click", () => renameCategory(category));

      actions.append(moveUpButton, moveDownButton, renameButton);
      return actions;
    }

    function createMiniIconButton(icon, label) {
      const button = document.createElement("button");
      button.className = "mini-button";
      button.type = "button";
      button.title = label;
      button.setAttribute("aria-label", label);
      const iconEl = document.createElement("i");
      iconEl.dataset.lucide = icon;
      button.append(iconEl);
      return button;
    }

    function moveCategory(category, direction) {
      const categories = getCategories().filter((item) => item !== "すべて");
      const index = categories.indexOf(category);
      const target = categories[index + direction];
      if (!target) return;

      [categories[index], categories[index + direction]] = [categories[index + direction], categories[index]];
      services = categories.flatMap((item) => services.filter((service) => service.category === item));
      saveServices();
      render();
    }

    function renameCategory(category) {
      const nextName = cleanText(prompt("新しいカテゴリ名", category), 40);
      if (!nextName || nextName === category) return;

      services = services.map((service) => service.category === category
        ? { ...service, category: nextName }
        : service);
      activeCategory = nextName;
      saveServices();
      render();
    }

    function deleteService(service) {
      const index = services.findIndex((item) => item.id === service.id);
      if (index < 0) return;

      pendingDelete = { service: services[index], index };
      services = services.filter((item) => item.id !== service.id);
      saveServices();
      render();
      showUndoToast(service.name);
    }

    function showUndoToast(name) {
      if (undoTimer) clearTimeout(undoTimer);
      undoMessage.textContent = `${name}を削除しました。`;
      undoToast.hidden = false;
      undoTimer = setTimeout(clearUndo, 6000);
    }

    function restoreDeletedService() {
      if (!pendingDelete) return;

      const restored = pendingDelete.service;
      const next = services.slice();
      next.splice(Math.min(pendingDelete.index, next.length), 0, restored);
      services = sanitizeServices(next);
      saveServices();
      activeCategory = restored.category;
      clearUndo();
      render();
    }

    function clearUndo() {
      pendingDelete = null;
      if (undoTimer) clearTimeout(undoTimer);
      undoTimer = null;
      undoToast.hidden = true;
    }

    function getCategoryPosition(service) {
      const peers = services.filter((item) => item.category === service.category);
      return {
        index: peers.findIndex((item) => item.id === service.id),
        total: peers.length
      };
    }

    function moveService(id, direction) {
      const currentIndex = services.findIndex((service) => service.id === id);
      if (currentIndex < 0) return;

      const current = services[currentIndex];
      const peers = services.filter((service) => service.category === current.category);
      const peerIndex = peers.findIndex((service) => service.id === id);
      const targetPeer = peers[peerIndex + direction];
      if (!targetPeer) return;

      const targetIndex = services.findIndex((service) => service.id === targetPeer.id);
      const next = services.slice();
      [next[currentIndex], next[targetIndex]] = [next[targetIndex], next[currentIndex]];
      services = next;
      saveServices();
      render();
    }

    function exportServices() {
      const data = {
        app: "Quiet Links",
        version: 1,
        exportedAt: new Date().toISOString(),
        services: sanitizeServices(services)
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `quiet-links-${formatDateForFile(new Date())}.json`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    async function importServices() {
      const file = importFile.files && importFile.files[0];
      if (!file) return;

      try {
        const data = JSON.parse(await file.text());
        const imported = getImportedServices(data);
        const nextServices = sanitizeServices(imported);
        if (nextServices.length === 0) throw new Error("No services");
        if (!confirm("現在のリンク一覧をインポート内容で置き換えます。")) return;

        services = nextServices;
        saveServices();
        clearUndo();
        searchInput.value = "";
        activeCategory = "すべて";
        render();
      } catch {
        alert("読み込めるリンクデータではありません。");
      } finally {
        importFile.value = "";
      }
    }

    function getImportedServices(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.services)) return data.services;
      return [];
    }

    function formatDateForFile(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}${month}${day}`;
    }

    function createFaviconImage(hostname, size) {
      const img = document.createElement("img");
      img.alt = "";
      img.decoding = "async";
      img.loading = "lazy";
      img.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostname)}&sz=${size}`;
      return img;
    }

    function renderTabs(categories) {
      tabsEl.replaceChildren();
      categories.forEach((category) => {
        const count = category === "すべて"
          ? services.length
          : services.filter((service) => service.category === category).length;
        const button = document.createElement("button");
        button.className = "tab";
        button.type = "button";
        button.setAttribute("aria-pressed", String(activeCategory === category));
        const label = document.createElement("span");
        label.textContent = category;
        const countEl = document.createElement("span");
        countEl.className = "tab-count";
        countEl.textContent = String(count);
        button.append(label, countEl);
        button.addEventListener("click", () => {
          activeCategory = category;
          render();
        });
        tabsEl.append(button);
      });
    }

    function renderQuickLinks() {
      quickRowEl.replaceChildren();
      services
        .filter((service) => service.favorite)
        .slice(0, 6)
        .forEach((service) => {
          const hostname = getHostname(service.url);
          const link = document.createElement("a");
          link.className = "quick-link";
          link.href = service.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.setAttribute("aria-label", `${service.name}を開く`);
          const img = createFaviconImage(hostname, 32);
          const label = document.createElement("span");
          label.textContent = service.name;
          link.append(img, label);
          quickRowEl.append(link);
        });
    }

    function renderCategoryOptions(categories) {
      const current = categoryField.value;
      const categoryOptions = categories.filter((category) => category !== "すべて");
      categoryOptionsEl.replaceChildren();
      (categoryOptions.length > 0 ? categoryOptions : ["未分類"]).forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categoryOptionsEl.append(option);
      });

      categoryField.value = current;
    }

    function getCategories() {
      return ["すべて", ...new Set(services.map((service) => service.category).filter(Boolean))];
    }

    function groupByCategory(items) {
      return getCategories()
        .filter((category) => category !== "すべて")
        .map((category) => [category, items.filter((service) => service.category === category)])
        .filter(([, group]) => group.length > 0);
    }

    function openDialog(service = null) {
      form.reset();
      urlField.setCustomValidity("");
      editingServiceId = service ? service.id : null;
      dialogTitle.textContent = service ? "リンクを編集" : "リンクを追加";
      submitLabel.textContent = service ? "更新" : "保存";

      if (service) {
        nameField.value = service.name;
        urlField.value = service.url;
        descriptionField.value = service.description;
        categoryField.value = service.category;
        tagsField.value = (service.tags || []).join(", ");
      } else {
        const categories = getCategories().filter((category) => category !== "すべて");
        const fallbackCategory = categories.includes("仕事") ? "仕事" : categories[0] || "未分類";
        categoryField.value = activeCategory === "すべて" ? fallbackCategory : activeCategory;
      }

      dialog.showModal();
      nameField.focus();
    }

    function handleGlobalKeydown(event) {
      if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;

      const target = event.target;
      const isTyping = target instanceof HTMLElement
        && ["INPUT", "SELECT", "TEXTAREA"].includes(target.tagName);

      if (event.key === "/" && !isTyping && !dialog.open) {
        event.preventDefault();
        searchInput.focus();
        searchInput.select();
        return;
      }

      if (event.key === "Escape" && document.activeElement === searchInput && searchInput.value) {
        searchInput.value = "";
        render();
      }
    }

    function getHostname(url) {
      try {
        return new URL(url).hostname;
      } catch {
        return "";
      }
    }

    function normalizeUrl(url) {
      const trimmed = cleanText(url, 2048);
      if (!trimmed) return "";

      const candidate = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
      try {
        const parsed = new URL(candidate);
        if (!["http:", "https:"].includes(parsed.protocol) || !parsed.hostname) return "";
        return parsed.href;
      } catch {
        return "";
      }
    }

    function splitTags(value) {
      return value
        .split(",")
        .map((tag) => tag.trim())
        .filter(Boolean);
    }

    function updateClock() {
      const now = new Date();
      document.querySelector("#clockTime").textContent = new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(now);
      document.querySelector("#clockDate").textContent = new Intl.DateTimeFormat("ja-JP", {
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(now);
    }

    function refreshIcons() {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    window.addEventListener("load", refreshIcons);
  </script>
</body>

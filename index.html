<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Links</title>
  <meta name="description" content="毎日使うリンクへ、迷わず最短で移動できるパーソナルダッシュボード">
  <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cdefs%3E%3ClinearGradient id="g" x1="0" y1="0" x2="1" y2="1"%3E%3Cstop offset="0" stop-color="%2353dfff"/%3E%3Cstop offset=".5" stop-color="%238b7bff"/%3E%3Cstop offset="1" stop-color="%23ff7ad9"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width="64" height="64" rx="14" fill="%2307080f"/%3E%3Ccircle cx="32" cy="32" r="11" fill="url(%23g)"/%3E%3C/svg%3E'>
  <link rel="preconnect" href="https://www.google.com">
  <link rel="preconnect" href="https://unpkg.com">
  <script src="https://unpkg.com/lucide@1.21.0/dist/umd/lucide.min.js" defer></script>
  <style>
    :root {
      --bg: #07080f;
      --panel: #12141f;
      --panel-2: #1a1e2e;
      --text: #f2f4ff;
      --muted: #9aa3c4;
      --line: #272c45;
      --accent: #53dfff;
      --accent-2: #ffc247;
      --danger: #ff6b81;
      --gradient: linear-gradient(120deg, #53dfff, #8b7bff 45%, #ff7ad9);
      --glow: 0 12px 40px -12px rgba(139, 123, 255, 0.5);
      color-scheme: dark;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans JP", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.5;
      pointer-events: none;
    }

    body::before {
      top: -22vmax;
      left: -14vmax;
      background: radial-gradient(circle at 30% 30%, rgba(83, 223, 255, 0.5), rgba(139, 123, 255, 0.28) 45%, transparent 70%);
      animation: drift-a 26s ease-in-out infinite alternate;
    }

    body::after {
      right: -18vmax;
      bottom: -24vmax;
      background: radial-gradient(circle at 70% 70%, rgba(255, 122, 217, 0.4), rgba(139, 123, 255, 0.22) 45%, transparent 70%);
      animation: drift-b 32s ease-in-out infinite alternate;
    }

    @keyframes drift-a {
      to {
        transform: translate(9vmax, 7vmax) rotate(30deg);
      }
    }

    @keyframes drift-b {
      to {
        transform: translate(-9vmax, -7vmax) rotate(-25deg);
      }
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
    }

    ::selection {
      background: color-mix(in srgb, var(--accent), transparent 60%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a:focus-visible,
    button:focus-visible,
    .field input:focus-visible,
    .field select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent), transparent 38%);
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 0 18px;
      animation: rise-in 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      background: var(--gradient);
      box-shadow: 0 0 18px rgba(139, 123, 255, 0.65);
      animation: brand-pulse 3.2s ease-in-out infinite;
    }

    @keyframes brand-pulse {
      50% {
        box-shadow: 0 0 28px rgba(83, 223, 255, 0.8);
      }
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .manage-only {
      display: none !important;
    }

    body.manage-mode .manage-only {
      display: inline-flex !important;
    }

    .manage-only[hidden] {
      display: none !important;
    }

    #manageButton[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent), var(--line) 30%);
      background: var(--panel-2);
      color: var(--accent);
      box-shadow: 0 8px 24px -12px rgba(83, 223, 255, 0.55);
    }

    .clock {
      min-width: 128px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel), transparent 20%);
      text-align: right;
    }

    .clock strong {
      display: block;
      font-size: 1.05rem;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .clock span {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .icon-button,
    .text-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel), transparent 20%);
      color: var(--text);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .icon-button {
      width: 40px;
      padding: 0;
    }

    .text-button {
      padding: 0 14px;
      font-weight: 600;
    }

    .icon-button:hover,
    .text-button:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent), var(--line) 35%);
      background: var(--panel-2);
      box-shadow: 0 8px 24px -10px rgba(83, 223, 255, 0.35);
    }

    .icon-button:active,
    .text-button:active {
      transform: translateY(0) scale(0.97);
    }

    .icon-button svg,
    .text-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 18px;
      animation: rise-in 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
    }

    .search-panel {
      display: grid;
      align-content: center;
      gap: 14px;
      min-height: 104px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
    }

    .greeting {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: clamp(1.5rem, 3.4vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .greeting-text {
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(720px, 100%);
      min-height: 54px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--bg), transparent 30%);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .search-box svg {
      width: 20px;
      height: 20px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow:
        0 0 0 3px color-mix(in srgb, var(--accent), transparent 75%),
        0 0 34px -6px color-mix(in srgb, var(--accent), transparent 55%);
    }

    .search-help {
      margin: -4px 2px 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .search-kbd {
      flex: 0 0 auto;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 7px;
      background: color-mix(in srgb, var(--panel-2), transparent 30%);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
    }

    .status-panel {
      display: grid;
      align-content: space-between;
      gap: 12px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(200deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
    }

    .status-heading {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-copy {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .metric {
      display: grid;
      gap: 3px;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
    }

    .metric strong {
      font-size: 2.3rem;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .quick-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel-2), transparent 15%);
      color: var(--text);
      font-size: 0.86rem;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .quick-link:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent), var(--line) 35%);
      box-shadow: 0 8px 20px -10px rgba(83, 223, 255, 0.45);
    }

    .quick-link img {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 8px 0 20px;
      overflow-x: auto;
      scrollbar-width: thin;
      animation: rise-in 0.6s 80ms cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel), transparent 20%);
      color: var(--muted);
      white-space: nowrap;
      transition: transform 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .tab:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent), var(--line) 40%);
      color: var(--text);
    }

    .tab[aria-pressed="true"] {
      border-color: transparent;
      background: var(--gradient);
      color: #07101a;
      font-weight: 700;
      box-shadow: 0 6px 20px -8px rgba(139, 123, 255, 0.8);
    }

    .tab-count {
      display: inline-grid;
      min-width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 999px;
      background: rgba(7, 8, 15, 0.55);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .tab[aria-pressed="true"] .tab-count {
      background: rgba(7, 8, 15, 0.2);
      color: inherit;
    }

    .section {
      margin: 6px 0 30px;
    }

    .section.is-home-section {
      margin-bottom: 34px;
    }

    .section-kicker {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .home-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -6px 0 18px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .home-note svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-actions {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .section-title::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 4px;
      background: var(--gradient);
      box-shadow: 0 0 12px rgba(139, 123, 255, 0.7);
    }

    .section-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 32px;
      gap: 12px;
      min-height: 116px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(170deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012));
      box-shadow: none;
      transition: transform 180ms cubic-bezier(0.2, 0.7, 0.3, 1), background 180ms ease, box-shadow 180ms ease;
    }

    body.manage-mode .card {
      grid-template-columns: 44px minmax(0, 1fr) 70px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      padding: 1px;
      border-radius: inherit;
      background: var(--gradient);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-4px);
      background: linear-gradient(170deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      box-shadow: var(--glow);
    }

    .card:hover::before {
      opacity: 1;
    }

    .is-animated .card {
      animation: card-in 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
      animation-delay: min(calc(var(--i, 0) * 40ms), 480ms);
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
    }

    .service-icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(7, 8, 15, 0.5);
      overflow: hidden;
    }

    .service-icon img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      transition: transform 200ms cubic-bezier(0.2, 0.7, 0.3, 1.4);
    }

    .card:hover .service-icon img {
      transform: scale(1.18) rotate(-4deg);
    }

    .card-body {
      min-width: 0;
    }

    .card h3 {
      margin: 1px 0 5px;
      overflow: hidden;
      font-size: 1rem;
      line-height: 1.2;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card p {
      display: -webkit-box;
      min-height: 2.4em;
      margin: 0 0 11px;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.35;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      max-width: 100%;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.1;
    }

    mark {
      padding: 0 3px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--accent), transparent 70%);
      color: var(--text);
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(2, 32px);
      align-content: start;
      gap: 6px;
    }

    body:not(.manage-mode) .card-actions {
      grid-template-columns: 32px;
    }

    .card-link::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
    }

    .service-icon,
    .card-actions {
      position: relative;
      z-index: 1;
    }

    .open-button {
      color: var(--accent);
    }

    .mini-button {
      display: inline-grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(7, 8, 15, 0.4);
      color: var(--muted);
      transition: transform 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    .mini-button:hover,
    .mini-button[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent), var(--line) 35%);
      color: var(--text);
    }

    .mini-button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .mini-button:active:not(:disabled) {
      transform: scale(0.92);
    }

    .mini-button:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .mini-button[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent-2), transparent 40%);
      background: color-mix(in srgb, var(--accent-2), var(--panel) 80%);
      color: var(--accent-2);
      box-shadow: 0 0 14px -2px color-mix(in srgb, var(--accent-2), transparent 45%);
    }

    .mini-button.danger:hover {
      border-color: color-mix(in srgb, var(--danger), var(--line) 30%);
      color: var(--danger);
    }

    .mini-button svg {
      width: 16px;
      height: 16px;
    }

    .empty {
      display: none;
      padding: 34px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }

    .empty.is-visible {
      display: block;
      animation: rise-in 0.3s ease backwards;
    }

    dialog {
      width: min(560px, calc(100% - 26px));
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 30px 90px -20px rgba(0, 0, 0, 0.7), var(--glow);
    }

    dialog[open] {
      animation: dialog-in 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.15) backwards;
    }

    @keyframes dialog-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }
    }

    dialog::backdrop {
      background: rgba(4, 5, 12, 0.6);
      backdrop-filter: blur(6px);
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dialog-head h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .dialog-copy {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .field input,
    .field select {
      min-height: 44px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(7, 8, 15, 0.5);
      color: var(--text);
      padding: 0 12px;
      outline: 0;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent), transparent 78%);
    }

    .field input:user-invalid {
      border-color: var(--danger);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .primary {
      border-color: transparent;
      background: var(--gradient);
      color: #07101a;
      font-weight: 800;
      box-shadow: 0 6px 22px -8px rgba(139, 123, 255, 0.7);
    }

    .primary:hover {
      border-color: transparent;
      background: var(--gradient);
      filter: brightness(1.12) saturate(1.05);
      box-shadow: 0 12px 30px -8px rgba(139, 123, 255, 0.85);
    }

    .secondary {
      background: transparent;
    }

    .toast-stack {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      display: grid;
      gap: 8px;
      width: min(420px, calc(100% - 32px));
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 12px 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--panel-2), transparent 10%);
      backdrop-filter: blur(10px);
      color: var(--text);
      box-shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.8);
      pointer-events: auto;
      animation: toast-in 0.32s cubic-bezier(0.2, 0.8, 0.3, 1.1) backwards;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
    }

    .toast[hidden] {
      display: none;
    }

    .toast span {
      min-width: 0;
      flex: 1;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .burst {
      position: fixed;
      z-index: 60;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .burst span {
      position: absolute;
      top: -3px;
      left: -3px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: burst-out 0.6s cubic-bezier(0.1, 0.6, 0.3, 1) forwards;
    }

    .burst span:nth-child(odd) {
      background: var(--accent);
    }

    @keyframes burst-out {
      to {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .icon-button:hover,
      .text-button:hover,
      .card:hover,
      .tab:hover,
      .quick-link:hover,
      .mini-button:hover:not(:disabled) {
        transform: none;
      }

      .card:hover .service-icon img {
        transform: none;
      }
    }

    @media (max-width: 850px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: start;
      }

      .clock {
        text-align: left;
      }

      .hero {
        display: grid;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 14px;
      }

      .search-panel {
        min-height: 92px;
        padding: 16px;
      }

      .search-kbd {
        display: none;
      }

      .status-panel {
        padding: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 108px;
      }

      .clock {
        display: none;
      }

      .toolbar {
        flex-wrap: nowrap;
      }

      #manageButton .button-label {
        display: none;
      }

      .toast-stack {
        right: 10px;
        bottom: 10px;
        width: calc(100% - 20px);
      }
    }
  </style>
</head>

  <script>

    const storageKey = "quiet-links-services-v1";

    const sectionsEl = document.querySelector("#sections");

    const form = document.querySelector("#linkForm");

    const importButton = document.querySelector("#importButton");
    const exportButton = document.querySelector("#exportButton");
    const importFile = document.querySelector("#importFile");

    categoryField.addEventListener("input", () => categoryField.setCustomValidity(""));

    urlField.addEventListener("blur", () => {
      const url = normalizeUrl(urlField.value);
      if (url) urlField.value = url;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const url = normalizeUrl(urlField.value);
      if (!url) {
        urlField.setCustomValidity("http:// または https:// で開けるURLを入力してください。");
        urlField.reportValidity();
        return;
      }

      const currentService = editingServiceId
        ? services.find((item) => item.id === editingServiceId)
        : null;
      if (isReservedCategoryName(categoryField.value)) {
        categoryField.setCustomValidity("「ホーム」と「すべて」は画面表示用のため、カテゴリ名には使えません。");
        categoryField.reportValidity();
        return;
      }

      categoryField.setCustomValidity("");
      const category = normalizeCategoryName(categoryField.value);
      const service = {
        id: editingServiceId || createServiceId(),
        name: nameField.value.trim(),
        url,
        description: descriptionField.value.trim(),
        category,
        tags: splitTags(tagsField.value),
        custom: currentService ? currentService.custom === true : true,
        favorite: currentService ? currentService.favorite === true : false,
        openCount: currentService ? currentService.openCount : 0,
        lastOpenedAt: currentService ? currentService.lastOpenedAt : ""
      };

      services = editingServiceId
        ? sanitizeServices(services.map((item) => item.id === editingServiceId ? service : item))
        : sanitizeServices([service, ...services]);
      saveServices();
      form.reset();
      dialog.close();
      editingServiceId = null;
      activeCategory = service.favorite ? homeCategoryLabel : service.category;
      render();
    });

    function loadServices() {
      try {
        const stored = JSON.parse(readStorage(storageKey));
        if (Array.isArray(stored)) return sanitizeServices(stored);
      } catch {
        // 壊れた保存データは無視して初期リンクを表示します。
      }
      return sanitizeServices(defaultServices);
    }

    function saveServices() {
      services = sanitizeServices(services);
      writeStorage(storageKey, JSON.stringify(services));
    }

    function recordServiceOpen(id) {
      const openedAt = new Date().toISOString();
      services = services.map((service) => service.id === id
        ? { ...service, openCount: (service.openCount || 0) + 1, lastOpenedAt: openedAt }
        : service);
      saveServices();
      setTimeout(() => render(), 0);
    }

    function toggleManageMode() {
      const isManaging = document.body.classList.toggle("manage-mode");
      manageButton.setAttribute("aria-pressed", String(isManaging));
      manageButton.setAttribute("aria-label", isManaging ? "整理を完了" : "リンクを整理");
      manageButton.querySelector(".button-label").textContent = isManaging ? "完了" : "整理";
      showNotice(isManaging
        ? "整理モード：星付け・編集・並べ替えができます。"
        : "整理を終えました。いつもの画面に戻ります。");
      refreshIcons();
    }

    function readStorage(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        // 保存できない環境でも画面操作は続けられるようにします。
      }
    }

    function sanitizeServices(items) {
      const usedIds = new Set();
      return items
        .map((item, index) => sanitizeService(item, index))
        .filter(Boolean)
        .map((service) => {
          const baseId = service.id;
          let id = baseId;
          let suffix = 2;
          while (usedIds.has(id)) {
            id = `${baseId}-${suffix}`;
            suffix += 1;
          }
          usedIds.add(id);
          return { ...service, id };
        });
    }

    function sanitizeService(item, index) {
      if (!item || typeof item !== "object") return null;

      const url = normalizeUrl(item.url);
      if (!url) return null;

      const hostname = getHostname(url);
      const service = {
        id: cleanText(item.id, 80) || `service-${index}`,
        name: cleanText(item.name, 80) || hostname || "名称未設定",
        url,
        description: cleanText(item.description, 160),
        category: normalizeCategoryName(item.category),
        tags: Array.isArray(item.tags)
          ? item.tags.map((tag) => cleanText(tag, 32)).filter(Boolean).slice(0, 8)
          : [],
        favorite: item.favorite === true,
        openCount: Number.isFinite(Number(item.openCount)) ? Math.max(0, Math.floor(Number(item.openCount))) : 0,
        lastOpenedAt: isValidDateString(item.lastOpenedAt) ? item.lastOpenedAt : ""
      };

      if (item.custom === true) service.custom = true;
      return service;
    }

    function isValidDateString(value) {
      return typeof value === "string" && value && Number.isFinite(Date.parse(value));
    }

    function cleanText(value, maxLength) {
      if (value == null) return "";
      return String(value).replace(/\s+/g, " ").trim().slice(0, maxLength);
    }

    function normalizeCategoryName(value) {
      const category = cleanText(value, 40);
      return category && !isReservedCategoryName(category) ? category : defaultCategoryLabel;
    }

    function isReservedCategoryName(value) {
      return [allCategoryLabel, homeCategoryLabel].includes(cleanText(value, 40));
    }

    function createServiceId() {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
        return `custom-${globalThis.crypto.randomUUID()}`;
      }
      return `custom-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function getSearchTokens(query) {
      return [...new Set(query.toLowerCase().split(/\s+/).map((token) => token.trim()).filter(Boolean))].slice(0, 8);
    }

    function scoreService(service, tokens) {
      if (tokens.length === 0) return 0;

      const fields = {
        name: service.name.toLowerCase(),
        description: service.description.toLowerCase(),
        category: service.category.toLowerCase(),
        hostname: getHostname(service.url).toLowerCase(),
        tags: (service.tags || []).map((tag) => tag.toLowerCase())
      };

      let total = 0;
      for (const token of tokens) {
        const tokenScore = scoreToken(fields, token);
        if (tokenScore === 0) return 0;
        total += tokenScore;
      }
      return total;
    }

    function scoreToken(fields, token) {
      let score = 0;
      if (fields.name === token) score += 140;
      else if (fields.name.startsWith(token)) score += 110;
      else if (fields.name.includes(token)) score += 90;

      if (fields.tags.some((tag) => tag === token)) score += 80;
      else if (fields.tags.some((tag) => tag.includes(token))) score += 55;

      if (fields.category.includes(token)) score += 50;
      if (fields.hostname.includes(token)) score += 35;
      if (fields.description.includes(token)) score += 25;
      return score;
    }

    function setHighlightedText(element, text, tokens) {
      element.replaceChildren();
      if (tokens.length === 0 || !text) {
        element.textContent = text;
        return;
      }

      const source = String(text);
      const lowerSource = source.toLowerCase();
      let index = 0;

      while (index < source.length) {
        const match = findNextTokenMatch(lowerSource, tokens, index);
        if (!match) {
          element.append(document.createTextNode(source.slice(index)));
          break;
        }

        if (match.start > index) {
          element.append(document.createTextNode(source.slice(index, match.start)));
        }

        const mark = document.createElement("mark");
        mark.textContent = source.slice(match.start, match.end);
        element.append(mark);
        index = match.end;
      }
    }

    function findNextTokenMatch(text, tokens, fromIndex) {
      return tokens
        .map((token) => {
          const start = text.indexOf(token, fromIndex);
          return start === -1 ? null : { start, end: start + token.length };
        })
        .filter(Boolean)
        .sort((a, b) => a.start - b.start || b.end - b.start - (a.end - a.start))[0];
    }

    function render({ animate = false } = {}) {
      const query = searchInput.value.trim();
      const searchTokens = getSearchTokens(query);
      const categories = getCategories();
      if (activeCategory !== homeCategoryLabel && !categories.includes(activeCategory)) {
        activeCategory = homeCategoryLabel;
      }

      renderTabs([homeCategoryLabel, ...categories]);
      renderQuickLinks();
      renderCategoryOptions(categories);

      const filtered = services
        .map((service, index) => ({
          index,
          score: scoreService(service, searchTokens),
          service
        }))
        .filter(({ service, score }) => {
          const categoryMatch = query
            || activeCategory === homeCategoryLabel
            || activeCategory === allCategoryLabel
            || service.category === activeCategory;
          return categoryMatch && (searchTokens.length === 0 || score > 0);
        })
        .sort((a, b) => searchTokens.length > 0 ? b.score - a.score || a.index - b.index : a.index - b.index)
        .map(({ service }) => service);

      const grouped = query
        ? [["検索結果", filtered]]
        : activeCategory === homeCategoryLabel
          ? getHomeGroups()
          : groupByCategory(filtered);
      sectionsEl.classList.toggle("is-animated", animate);
      sectionsEl.replaceChildren();
      let cardIndex = 0;
      firstVisibleService = grouped[0]?.[1]?.[0] || null;

      if (!query && activeCategory === homeCategoryLabel) {
        const note = document.createElement("p");
        note.className = "home-note";
        const icon = document.createElement("i");
        icon.dataset.lucide = "sparkles";
        note.append(icon, document.createTextNode("リンクを開くほど「最近使った」が育ち、次の移動が速くなります。"));
        sectionsEl.append(note);
      }

      grouped.forEach(([category, items]) => {
        if (items.length === 0) return;
        const section = document.createElement("section");
        const isHomeSection = !query && activeCategory === homeCategoryLabel;
        section.className = `section${isHomeSection ? " is-home-section" : ""}`;

        const sectionHead = document.createElement("div");
        sectionHead.className = "section-head";
        const titleGroup = document.createElement("div");
        if (isHomeSection) {
          const kicker = document.createElement("p");
          kicker.className = "section-kicker";
          kicker.textContent = category === "最近使った" ? "History" : "Daily";
          titleGroup.append(kicker);
        }
        const sectionTitle = document.createElement("h2");
        sectionTitle.className = "section-title";
        sectionTitle.textContent = category;
        const sectionSubtitle = document.createElement("p");
        sectionSubtitle.className = "section-subtitle";
        sectionSubtitle.textContent = category === "いつものリンク"
          ? "星を付けたリンク"
          : category === "まずはここから"
            ? "「整理」から星を付けるとホームを自分用にできます"
          : category === "最近使った"
            ? "直近に開いた順"
            : `${items.length}件`;
        titleGroup.append(sectionTitle, sectionSubtitle);
        sectionHead.append(titleGroup);
        if (!query && !isHomeSection) sectionHead.append(createCategoryActions(category));

        const grid = document.createElement("div");
        grid.className = "grid";
        items.forEach((service) => {
          const card = createCard(service, searchTokens);
          card.style.setProperty("--i", String(cardIndex));
          cardIndex += 1;
          grid.append(card);
        });
        section.append(sectionHead, grid);
        sectionsEl.append(section);
      });

      setMetric(visibleCountEl, services.length, animate);
      setMetric(favoriteCountEl, services.filter((service) => service.favorite).length, animate);
      const visibleItems = grouped.reduce((total, [, items]) => total + items.length, 0);
      emptyStateEl.classList.toggle("is-visible", visibleItems === 0);
      searchHelpEl.textContent = query && firstVisibleService
        ? `Enterで「${firstVisibleService.name}」を開く`
        : "名前・カテゴリ・タグから検索できます";
      refreshIcons();
    }

    function getHomeGroups() {
      const byUsage = (a, b) => (b.openCount || 0) - (a.openCount || 0)
        || Date.parse(b.lastOpenedAt || 0) - Date.parse(a.lastOpenedAt || 0)
        || services.indexOf(a) - services.indexOf(b);
      const favorites = services.filter((service) => service.favorite).sort(byUsage).slice(0, 8);
      const primaryTitle = favorites.length > 0 ? "いつものリンク" : "まずはここから";
      const primary = favorites.length > 0 ? favorites : services.slice(0, 6);
      const recent = services
        .filter((service) => service.lastOpenedAt && !service.favorite)
        .sort((a, b) => Date.parse(b.lastOpenedAt) - Date.parse(a.lastOpenedAt))
        .slice(0, 4);
      return [[primaryTitle, primary], ["最近使った", recent]];
    }

    function createCard(service, searchTokens = []) {
      const node = cardTemplate.content.firstElementChild.cloneNode(true);
      const hostname = getHostname(service.url);
      const iconLink = node.querySelector(".service-icon");
      const cardLink = node.querySelector(".card-link");
      const openButton = node.querySelector(".open-button");
      const favoriteButton = node.querySelector(".favorite-button");
      const editButton = node.querySelector(".edit-button");
      const deleteButton = node.querySelector(".delete-button");

      iconLink.href = service.url;
      iconLink.setAttribute("aria-label", `${service.name}を開く`);
      iconLink.replaceChildren(createFaviconImage(hostname, 64));
      cardLink.href = service.url;
      cardLink.setAttribute("aria-label", `${service.name}を開く`);
      openButton.href = service.url;
      openButton.setAttribute("aria-label", `${service.name}を開く`);
      setHighlightedText(node.querySelector("h3"), service.name, searchTokens);
      setHighlightedText(node.querySelector("p"), service.description || hostname, searchTokens);
      favoriteButton.setAttribute("aria-pressed", service.favorite ? "true" : "false");
      favoriteButton.setAttribute(
        "aria-label",
        service.favorite ? `${service.name}のお気に入りを解除` : `${service.name}をお気に入りに追加`
      );
      editButton.setAttribute("aria-label", `${service.name}を編集`);
      deleteButton.hidden = !service.custom;
      deleteButton.setAttribute("aria-label", `${service.name}を削除`);

      [iconLink, cardLink, openButton].forEach((link) => {
        link.addEventListener("click", () => recordServiceOpen(service.id));
      });

      const tagRow = node.querySelector(".tag-row");
      [hostname, ...(service.tags || [])].slice(0, 4).forEach((tag) => {
        const tagEl = document.createElement("span");
        tagEl.className = "tag";
        setHighlightedText(tagEl, tag, searchTokens);
        tagRow.append(tagEl);
      });

      const position = getCategoryPosition(service);
      favoriteButton.addEventListener("click", () => {
        const willFavorite = !service.favorite;
        if (willFavorite) {
          const rect = favoriteButton.getBoundingClientRect();
          burstAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        services = services.map((item) => item.id === service.id ? { ...item, favorite: willFavorite } : item);
        saveServices();
        render();
      });

      editButton.addEventListener("click", () => openDialog(service));

      const moveUpButton = node.querySelector(".move-up-button");
      const moveDownButton = node.querySelector(".move-down-button");
      moveUpButton.disabled = position.index <= 0;
      moveDownButton.disabled = position.index === -1 || position.index >= position.total - 1;
      moveUpButton.setAttribute("aria-label", `${service.name}を上へ移動`);
      moveDownButton.setAttribute("aria-label", `${service.name}を下へ移動`);
      moveUpButton.addEventListener("click", () => moveService(service.id, -1));
      moveDownButton.addEventListener("click", () => moveService(service.id, 1));

      deleteButton.addEventListener("click", () => {
        deleteService(service);
      });

      return node;
    }

    function createCategoryActions(category) {
      const actions = document.createElement("div");
      actions.className = "section-actions manage-only";
      const categories = getCategories().filter((item) => item !== allCategoryLabel);
      const index = categories.indexOf(category);

      const moveUpButton = createMiniIconButton("chevron-up", `${category}を上へ移動`);
      const moveDownButton = createMiniIconButton("chevron-down", `${category}を下へ移動`);
      const renameButton = createMiniIconButton("pencil", `${category}の名前を変更`);

      moveUpButton.disabled = index <= 0;
      moveDownButton.disabled = index === -1 || index >= categories.length - 1;
      moveUpButton.addEventListener("click", () => moveCategory(category, -1));
      moveDownButton.addEventListener("click", () => moveCategory(category, 1));
      renameButton.addEventListener("click", () => openCategoryDialog(category));

      actions.append(moveUpButton, moveDownButton, renameButton);
      return actions;
    }

    function createMiniIconButton(icon, label) {
      const button = document.createElement("button");
      button.className = "mini-button";
      button.type = "button";
      button.title = label;
      button.setAttribute("aria-label", label);
      const iconEl = document.createElement("i");
      iconEl.dataset.lucide = icon;
      button.append(iconEl);
      return button;
    }

    function moveCategory(category, direction) {
      const categories = getCategories().filter((item) => item !== allCategoryLabel);
      const index = categories.indexOf(category);
      const target = categories[index + direction];
      if (!target) return;

      [categories[index], categories[index + direction]] = [categories[index + direction], categories[index]];
      services = categories.flatMap((item) => services.filter((service) => service.category === item));
      saveServices();
      render();
    }

    function openCategoryDialog(category) {
      renamingCategory = category;
      categoryForm.reset();
      categoryNameField.setCustomValidity("");
      categoryNameField.value = category;
      categoryDialog.showModal();
      categoryNameField.focus();
      categoryNameField.select();
    }

    function closeCategoryDialog() {
      renamingCategory = null;
      categoryDialog.close();
    }

    function submitCategoryRename(event) {
      event.preventDefault();
      if (!renamingCategory) return;

      const nextName = cleanText(categoryNameField.value, 40);
      if (!nextName) {
        categoryNameField.setCustomValidity("カテゴリ名を入力してください。");
        categoryNameField.reportValidity();
        return;
      }

      if (isReservedCategoryName(nextName)) {
        categoryNameField.setCustomValidity("「ホーム」と「すべて」は画面表示用のため、カテゴリ名には使えません。");
        categoryNameField.reportValidity();
        return;
      }

      const currentName = renamingCategory;
      if (nextName === currentName) {
        closeCategoryDialog();
        return;
      }

      renameCategory(currentName, nextName);
      closeCategoryDialog();
    }

    function renameCategory(category, nextName) {
      services = services.map((service) => service.category === category
        ? { ...service, category: nextName }
        : service);
      activeCategory = nextName;
      saveServices();
      render();
    }

    function deleteService(service) {
      const index = services.findIndex((item) => item.id === service.id);
      if (index < 0) return;

      pendingDelete = { service: services[index], index };
      services = services.filter((item) => item.id !== service.id);
      saveServices();
      render();
      showUndoToast(service.name);
    }

    function showUndoToast(name) {
      if (undoTimer) clearTimeout(undoTimer);
      undoMessage.textContent = `${name}を削除しました。`;
      undoToast.hidden = false;
      undoTimer = setTimeout(clearUndo, 6000);
    }

    function restoreDeletedService() {
      if (!pendingDelete) return;

      const restored = pendingDelete.service;
      const next = services.slice();
      next.splice(Math.min(pendingDelete.index, next.length), 0, restored);
      services = sanitizeServices(next);
      saveServices();
      activeCategory = restored.category;
      clearUndo();
      render();
    }

    function clearUndo() {
      pendingDelete = null;
      if (undoTimer) clearTimeout(undoTimer);
      undoTimer = null;
      undoToast.hidden = true;
    }

    function getCategoryPosition(service) {
      const peers = services.filter((item) => item.category === service.category);
      return {
        index: peers.findIndex((item) => item.id === service.id),
        total: peers.length
      };
    }

    function moveService(id, direction) {
      const currentIndex = services.findIndex((service) => service.id === id);
      if (currentIndex < 0) return;

      const current = services[currentIndex];
      const peers = services.filter((service) => service.category === current.category);
      const peerIndex = peers.findIndex((service) => service.id === id);
      const targetPeer = peers[peerIndex + direction];
      if (!targetPeer) return;

      const targetIndex = services.findIndex((service) => service.id === targetPeer.id);
      const next = services.slice();
      [next[currentIndex], next[targetIndex]] = [next[targetIndex], next[currentIndex]];
      services = next;
      saveServices();
      render();
    }

    function exportServices() {
      const data = {
        app: "Quiet Links",
        version: 1,
        exportedAt: new Date().toISOString(),
        services: sanitizeServices(services)
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `quiet-links-${formatDateForFile(new Date())}.json`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      showNotice("リンク一覧をエクスポートしました。");
    }

    async function importServices() {
      const file = importFile.files && importFile.files[0];
      if (!file) return;

      try {
        const data = JSON.parse(await file.text());
        const imported = getImportedServices(data);
        const nextServices = sanitizeServices(imported);
        if (nextServices.length === 0) throw new Error("No services");
        const confirmed = await askConfirmation({
          title: "インポートしますか",
          message: "現在のリンク一覧をインポート内容で置き換えます。この操作は元に戻せません。",
          confirmLabel: "置き換える"
        });
        if (!confirmed) return;

        services = nextServices;
        saveServices();
        clearUndo();
        searchInput.value = "";
        activeCategory = homeCategoryLabel;
        render();
        showNotice("リンク一覧をインポートしました。");
      } catch {
        showNotice("読み込めるリンクデータではありません。");
      } finally {
        importFile.value = "";
      }
    }

    function askConfirmation({ title, message, confirmLabel }) {
      if (confirmResolver) closeConfirmDialog(false);

      confirmTitle.textContent = title;
      confirmMessage.textContent = message;
      confirmSubmitButton.textContent = confirmLabel;
      confirmDialog.showModal();
      confirmSubmitButton.focus();

      return new Promise((resolve) => {
        confirmResolver = resolve;
      });
    }

    function closeConfirmDialog(confirmed) {
      if (!confirmDialog.open && !confirmResolver) return;

      if (confirmDialog.open) confirmDialog.close();
      const resolve = confirmResolver;
      confirmResolver = null;
      if (resolve) resolve(confirmed);
    }

    function showNotice(message) {
      if (noticeTimer) clearTimeout(noticeTimer);

      noticeMessage.textContent = message;
      noticeToast.hidden = false;
      noticeTimer = setTimeout(() => {
        noticeToast.hidden = true;
        noticeTimer = null;
      }, 4200);
    }

    function getImportedServices(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.services)) return data.services;
      return [];
    }

    function formatDateForFile(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}${month}${day}`;
    }

    function createFaviconImage(hostname, size) {
      const img = document.createElement("img");
      img.alt = "";
      img.decoding = "async";
      img.loading = "lazy";
      img.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostname)}&sz=${size}`;
      return img;
    }

    function renderTabs(categories) {
      tabsEl.replaceChildren();
      categories.forEach((category) => {
        const count = category === homeCategoryLabel
          ? services.filter((service) => service.favorite).length
          : category === allCategoryLabel
            ? services.length
            : services.filter((service) => service.category === category).length;
        const button = document.createElement("button");
        button.className = "tab";
        button.type = "button";
        button.setAttribute("aria-pressed", String(activeCategory === category));
        const label = document.createElement("span");
        label.textContent = category;
        const countEl = document.createElement("span");
        countEl.className = "tab-count";
        countEl.textContent = String(count);
        button.append(label, countEl);
        button.addEventListener("click", () => {
          activeCategory = category;
          searchInput.value = "";
          render({ animate: true });
        });
        tabsEl.append(button);
      });
    }

    function renderQuickLinks() {
      quickRowEl.replaceChildren();
      services
        .filter((service) => service.favorite)
        .sort((a, b) => (b.openCount || 0) - (a.openCount || 0)
          || Date.parse(b.lastOpenedAt || 0) - Date.parse(a.lastOpenedAt || 0))
        .slice(0, 6)
        .forEach((service) => {
          const hostname = getHostname(service.url);
          const link = document.createElement("a");
          link.className = "quick-link";
          link.href = service.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.setAttribute("aria-label", `${service.name}を開く`);
          link.addEventListener("click", () => recordServiceOpen(service.id));
          const img = createFaviconImage(hostname, 32);
          const label = document.createElement("span");
          label.textContent = service.name;
          link.append(img, label);
          quickRowEl.append(link);
        });
    }

    function renderCategoryOptions(categories) {
      const current = categoryField.value;
      const categoryOptions = categories.filter((category) => category !== allCategoryLabel);
      categoryOptionsEl.replaceChildren();
      (categoryOptions.length > 0 ? categoryOptions : [defaultCategoryLabel]).forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categoryOptionsEl.append(option);
      });

      categoryField.value = current;
    }

    function getCategories() {
      return [allCategoryLabel, ...new Set(services.map((service) => service.category).filter(Boolean))];
    }

    function groupByCategory(items) {
      return getCategories()
        .filter((category) => category !== allCategoryLabel)
        .map((category) => [category, items.filter((service) => service.category === category)])
        .filter(([, group]) => group.length > 0);
    }

    function openDialog(service = null) {
      form.reset();
      urlField.setCustomValidity("");
      categoryField.setCustomValidity("");
      editingServiceId = service ? service.id : null;
      dialogTitle.textContent = service ? "リンクを編集" : "リンクを追加";
      submitLabel.textContent = service ? "更新" : "保存";

      if (service) {
        nameField.value = service.name;
        urlField.value = service.url;
        descriptionField.value = service.description;
        categoryField.value = service.category;
        tagsField.value = (service.tags || []).join(", ");
      } else {
        const categories = getCategories().filter((category) => category !== allCategoryLabel);
        const fallbackCategory = categories.includes("仕事") ? "仕事" : categories[0] || defaultCategoryLabel;
        categoryField.value = [homeCategoryLabel, allCategoryLabel].includes(activeCategory)
          ? fallbackCategory
          : activeCategory;
      }

      dialog.showModal();
      nameField.focus();
    }

    function handleGlobalKeydown(event) {
      if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;

      const target = event.target;
      const isTyping = target instanceof HTMLElement
        && ["INPUT", "SELECT", "TEXTAREA"].includes(target.tagName);

      if (isAnyDialogOpen()) return;

      if (event.key === "/" && !isTyping) {
        event.preventDefault();
        searchInput.focus();
        searchInput.select();
        return;
      }

      if (event.key === "Escape" && document.activeElement === searchInput && searchInput.value) {
        searchInput.value = "";
        render();
      }
    }

    function isAnyDialogOpen() {
      return dialog.open || categoryDialog.open || confirmDialog.open;
    }

    function getHostname(url) {
      try {
        return new URL(url).hostname;
      } catch {
        return "";
      }
    }

    function normalizeUrl(url) {
      const trimmed = cleanText(url, 2048);
      if (!trimmed) return "";

      const candidate = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
      try {
        const parsed = new URL(candidate);
        if (!["http:", "https:"].includes(parsed.protocol) || !parsed.hostname) return "";
        return parsed.href;
      } catch {
        return "";
      }
    }

    function splitTags(value) {
      return value
        .split(",")
        .map((tag) => tag.trim())
        .filter(Boolean);
    }

    function updateClock() {
      const now = new Date();
      document.querySelector("#clockTime").textContent = new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(now);
      document.querySelector("#clockDate").textContent = new Intl.DateTimeFormat("ja-JP", {
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(now);
      updateGreeting(now.getHours());
    }

    function updateGreeting(hour) {
      let text = "こんばんは";
      let emoji = "🌙";
      if (hour >= 5 && hour < 10) {
        text = "おはようございます";
        emoji = "☀️";
      } else if (hour >= 10 && hour < 17) {
        text = "こんにちは";
        emoji = "🌤️";
      } else if (hour >= 23 || hour < 5) {
        text = "夜ふかしモード";
        emoji = "🌌";
      }
      greetingTextEl.textContent = text;
      greetingEmojiEl.textContent = emoji;
    }

    function setMetric(element, value, animate) {
      const target = Number(value) || 0;
      element.dataset.target = String(target);
      if (!animate || prefersReducedMotion.matches || target === 0) {
        element.textContent = String(target);
        return;
      }

      const duration = 600;
      const start = performance.now();
      const tick = (now) => {
        if (element.dataset.target !== String(target)) return;
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        element.textContent = String(Math.round(target * eased));
        if (progress < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function burstAt(x, y) {
      if (prefersReducedMotion.matches) return;

      const burst = document.createElement("div");
      burst.className = "burst";
      burst.style.left = `${x}px`;
      burst.style.top = `${y}px`;
      for (let i = 0; i < 10; i += 1) {
        const particle = document.createElement("span");
        const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.5;
        const distance = 24 + Math.random() * 26;
        particle.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        burst.append(particle);
      }
      document.body.append(burst);
      setTimeout(() => burst.remove(), 700);
    }

    function refreshIcons() {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    window.addEventListener("load", refreshIcons);
  </script>
</body>
</html>
